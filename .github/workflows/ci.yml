name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install rouge-score numpy pytest
      - run: pytest -q
      - run: python -c "import inference, benchmark; print('entrypoints import OK')"
      - run: python finetune.py --task synthetic --dry_run --n_examples 20
